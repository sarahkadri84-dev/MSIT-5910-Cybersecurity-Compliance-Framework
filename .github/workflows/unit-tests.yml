name: Unit 5 tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov
      - run: python -m pytest -q --cov=src --cov-report=term-missing --cov-fail-under=100
